name: Fin_res temporary SEC transfer

on:
  push:
    branches: [fin-res-sec-transfer-20260821]

permissions:
  contents: write

jobs:
  hydrate:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fin-res-sec-transfer-20260821
          fetch-depth: 1
      - name: Download, validate and package six SEC filings
        env:
          SEC_USER_AGENT: "Fin_res SEC Hydrator/2.0 support@openai.com"
        run: |
          cat > /tmp/hydrate.py <<'PY'
          from __future__ import annotations
          import gzip, hashlib, json, os, pathlib, re, time, urllib.error, urllib.request, zlib

          out = pathlib.Path("sec_hydrated")
          out.mkdir(exist_ok=True)
          ua = os.environ["SEC_USER_AGENT"]
          rows = [
            {"ticker":"NVDA","period":"Q1","url":"https://www.sec.gov/Archives/edgar/data/1045810/000104581025000116/nvda-20250427.htm","name":"FY2026_Q1_10-Q_2025-04-27_2025-05-28_0001045810-25-000116.htm","sha256":"9f71aa343f38059e3e99cc1c37d97efee9971f4e3fd33377e363064c3a0168f4"},
            {"ticker":"NVDA","period":"Q2","url":"https://www.sec.gov/Archives/edgar/data/1045810/000104581025000209/nvda-20250727.htm","name":"FY2026_Q2_10-Q_2025-07-27_2025-08-27_0001045810-25-000209.htm","sha256":"df1074c0b522e2c35d75a5f3e8d5aa0f39504059c935021f7e84f5a3f0d08d73"},
            {"ticker":"AAPL","period":"Q1","url":"https://www.sec.gov/Archives/edgar/data/320193/000032019326000006/aapl-20251227.htm","name":"FY2026_Q1_10-Q_2025-12-27_2026-01-30_0000320193-26-000006.htm","sha256":"3a3d9336a924488440e83b811ba354f654738cc822b6eb69ed6063e8cf348542"},
            {"ticker":"AAPL","period":"Q2","url":"https://www.sec.gov/Archives/edgar/data/320193/000032019326000013/aapl-20260328.htm","name":"FY2026_Q2_10-Q_2026-03-28_2026-05-01_0000320193-26-000013.htm","sha256":"bb90060d61a273e51b5a472d65ae15d8b51bfd037ddf91e559f9d9adfe2a0228"},
            {"ticker":"GOOGL","period":"Q1","url":"https://www.sec.gov/Archives/edgar/data/1652044/000165204426000048/goog-20260331.htm","name":"FY2026_Q1_10-Q_2026-03-31_2026-04-30_0001652044-26-000048.htm","sha256":"2ff47ad277068104a8b165a86c897fa3f258546ee7c4a3aa354fa87d3cb0bd02"},
            {"ticker":"GOOGL","period":"Q2","url":"https://www.sec.gov/Archives/edgar/data/1652044/000165204426000071/goog-20260630.htm","name":"FY2026_Q2_10-Q_2026-06-30_2026-07-23_0001652044-26-000071.htm","sha256":"fecfbc2683f630380b17937278ce3745eca150eb90e21a945fd6b78fe19728c7"},
          ]

          last = 0.0
          results = []
          for row in rows:
              for attempt in range(1, 6):
                  delay = 0.25 - (time.monotonic() - last)
                  if delay > 0: time.sleep(delay)
                  req = urllib.request.Request(row["url"], headers={
                      "User-Agent": ua,
                      "Accept": "text/html,application/xhtml+xml;q=0.9,*/*;q=0.1",
                      "Accept-Encoding": "gzip, deflate",
                  })
                  last = time.monotonic()
                  try:
                      with urllib.request.urlopen(req, timeout=45) as response:
                          payload = response.read()
                          enc = (response.headers.get("Content-Encoding") or "").lower()
                          if enc == "gzip": payload = gzip.decompress(payload)
                          elif enc == "deflate": payload = zlib.decompress(payload)
                          status = response.status
                          content_type = response.headers.get("Content-Type", "")
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code not in {403,429,500,502,503,504} or attempt == 5: raise
                      retry = exc.headers.get("Retry-After")
                      time.sleep(float(retry) if retry and retry.isdigit() else min(16, 2 ** attempt))
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 5: raise
                      time.sleep(min(16, 2 ** attempt))
              text = payload.decode("utf-8", errors="ignore")
              digest = hashlib.sha256(payload).hexdigest()
              if status != 200 or len(payload) < 5000: raise RuntimeError(f"bad response {row['ticker']} {row['period']}")
              if digest != row["sha256"]: raise RuntimeError(f"hash mismatch {row['ticker']} {row['period']}: {digest}")
              if not re.search(r"<html|<xhtml|<!doctype\s+html", text[:500000], re.I): raise RuntimeError("not HTML")
              if not re.search(r"xmlns:ix\s*=|<ix:", text, re.I): raise RuntimeError("missing Inline XBRL")
              if "DocumentType" not in text or "EntityCentralIndexKey" not in text: raise RuntimeError("missing DEI")
              target = out / row["ticker"] / row["name"]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(payload)
              results.append({**row, "bytes":len(payload), "http_status":status, "content_type":content_type, "downloaded_at_utc":time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())})
              print(f"SUCCESS {row['ticker']} {row['period']} {len(payload)} {digest}")
          (out / "hydration_results.json").write_text(json.dumps(results, indent=2) + "\n", encoding="utf-8")
          PY
          rm -rf sec_hydrated transfer
          python /tmp/hydrate.py
          mkdir transfer
          tar --sort=name --mtime='UTC 2026-08-22' --owner=0 --group=0 --numeric-owner -cf - sec_hydrated | xz -9e --threads=0 > transfer/fin_res_sec_hydrated_6.tar.xz
          sha256sum transfer/fin_res_sec_hydrated_6.tar.xz > transfer/fin_res_sec_hydrated_6.tar.xz.sha256
          cp sec_hydrated/hydration_results.json transfer/
          wc -c transfer/*
      - name: Commit temporary public transfer payload
        run: |
          git config user.name "fin-res-sec-hydrator"
          git config user.email "support@openai.com"
          git add -- transfer
          git commit -m "Temporary verified SEC transfer payload [skip ci]"
          git push origin HEAD:fin-res-sec-transfer-20260821
